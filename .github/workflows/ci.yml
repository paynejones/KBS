name: CI

on:
  push:
  pull_request:
  # The release workflow calls this file, so a release cannot ship a commit
  # that fails these checks.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kbs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kbs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kbs
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: npm run test:db
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Build and reject Turbopack filesystem tracing warnings
        run: npm run check:build-warnings

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kbs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kbs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kbs
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
